name: release

# Publishes to PyPI when a version tag is pushed:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI trusted publishing (OIDC), so there is no API token in this repo's
# secrets — nothing to leak, nothing to rotate. Configure it once at
# https://pypi.org/manage/project/zeyvor/settings/publishing/ with:
#
#     owner: zeyvor            repository: zeyvor
#     workflow: release.yml    environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # can reproduce from the source, so fail before uploading rather than after.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject: $PACKAGE   tag: $TAG"
          test "$PACKAGE" = "$TAG"

      - name: Tests must pass on the code being released
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
