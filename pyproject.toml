[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeyvor"
version = "0.6.1"
description = "Semantic data quality: catch when your data stops meaning what your schema says it means."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zeyvor" }]
keywords = ["data-quality", "data-contracts", "profiling", "duckdb", "dbt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]

# duckdb is the execution engine and the gateway to Postgres/MySQL/SQLite via
# its own extensions; PyYAML reads and writes the contract file. Deliberately
# nothing else: `zeyvor check` must run in CI with no API key and no network.
dependencies = ["duckdb>=0.10.0", "PyYAML>=6.0"]

[project.optional-dependencies]
postgres = ["duckdb>=0.10.0"]          # served by the duckdb `postgres` extension
bigquery = ["google-cloud-bigquery>=3.0"]
ai = ["anthropic>=0.40"]               # only needed to *generate* a contract
dev = ["pytest>=7.0", "pytest-cov>=4.0", "anthropic>=0.40"]

[project.scripts]
zeyvor = "zeyvor.cli.main:main"

[project.urls]
Homepage = "https://zeyvor.com"
Repository = "https://github.com/zeyvor/zeyvor"

[tool.hatch.build.targets.wheel]
packages = ["src/zeyvor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Not a style crusade — these are the rules that catch actual mistakes across a
# few thousand lines: dead imports, shadowed names, mutable defaults, bare
# excepts, comparison slips.
select = ["E", "F", "W", "I", "B", "UP", "C4", "RET", "SIM"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B027",    # Engine.close is an intentional optional hook, not an abstract method
  "B008",    # function calls in defaults are used deliberately for dataclasses
  "SIM108",  # ternaries are not always clearer than an if
  "RET505",  # else-after-return often reads better
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures locally on purpose, and assert on private helpers.
"tests/*" = ["B011", "TID252"]

[tool.ruff.format]
quote-style = "double"
