name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows carries real risk rather than notional: the ASCII symbol
          # fallback in render.py exists for a legacy console code page, and the
          # path handling in sources.py branches on os.name. Oldest and newest
          # supported Python, since version and platform interact.
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        # warn_default_encoding turns any reliance on the platform's default
        # text encoding into an error. Without it, the Windows runner is the
        # first thing that discovers a missing `encoding=` — as it was twice.
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q

      # The suite is offline by design; prove it rather than trusting it.
      - name: Confirm the CLI runs from the install
        run: |
          zeyvor --version
          zeyvor profile tests/fixtures/clean_orders.csv --json > profile.json
          python -c "import json; d=json.load(open('profile.json')); assert d['row_count']==100, d"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  package:
    name: build and install as a stranger would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # Install the built wheel into a clean environment with no source tree on
      # the path. This is the only test that exercises the real packaging: the
      # entry point, the dependency set, and the absence of test files.
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fresh/bin/zeyvor --version

      - name: Check runs without the optional AI dependency
        run: |
          /tmp/fresh/bin/python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('anthropic') is None, 'anthropic must stay optional'
          print('confirmed: checking needs no AI dependency')
          "
          cp tests/fixtures/clean_orders.csv /tmp/orders.csv
          cd /tmp && /tmp/fresh/bin/zeyvor init orders.csv && /tmp/fresh/bin/zeyvor check

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
